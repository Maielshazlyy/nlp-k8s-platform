name: ci
on:
  push: {branches: [main], tags: ['v*']}
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: api/requirements*.txt}
      - run: pip install -r api/requirements-dev.txt
      - run: cd api && ruff check . && pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render + validate every overlay
        run: |
          for o in dev ci prod; do
            echo "::group::$o"
            kubectl kustomize k8s/overlays/$o | kubeconform -strict -summary -ignore-missing-schemas -
            echo "::endgroup::"
          done
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: api/Dockerfile, failure-threshold: error}

  e2e:
    needs: [test, manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: {config: kind/kind-config.yaml, cluster_name: nlp}
      - name: Build slim image and load into kind
        run: |
          docker build --build-arg WITH_ML=false -t nlp-api:ci api
          kind load docker-image nlp-api:ci --name nlp
      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=ready pod -l app.kubernetes.io/component=controller --timeout=180s
      - name: Deploy ci overlay
        run: |
          kubectl apply -k k8s/overlays/ci
          kubectl -n nlp rollout status deploy/nlp-api --timeout=180s
          kubectl -n nlp rollout status deploy/redis --timeout=120s
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n nlp get all,hpa,pdb,netpol,ingress -o wide || true
          kubectl -n nlp describe pods || true
          kubectl -n nlp logs deploy/nlp-api --tail=100 || true

  publish:
    if: github.event_name == 'push'
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write, security-events: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: {sarif_file: trivy.sarif}
