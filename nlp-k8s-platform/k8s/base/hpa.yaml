apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nlp-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: nlp-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Pods, value: 2, periodSeconds: 30}
    scaleDown:
      stabilizationWindowSeconds: 300      # avoid flapping after load spikes
      policies:
        - {type: Pods, value: 1, periodSeconds: 60}
