apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nlp-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/nlp-k8s-platform.git   # <- your repo
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: nlp
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false, ServerSideApply=true]
    retry: {limit: 3, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]     # HPA owns replica count
