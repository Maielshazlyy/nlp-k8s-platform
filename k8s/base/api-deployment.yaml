apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-api
  labels: {app.kubernetes.io/name: nlp-api, app.kubernetes.io/component: api}
spec:
  # replicas intentionally omitted: owned by the HorizontalPodAutoscaler
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime rollouts
  selector:
    matchLabels: {app.kubernetes.io/name: nlp-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nlp-api, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: nlp-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: nlp-api}
      containers:
        - name: api
          image: nlp-api            # replaced per-overlay via kustomize `images:`
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: nlp-api-config}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Model loading takes a while: startupProbe gives it up to ~3 min
          # without making the liveness probe aggressive afterwards.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}   # let endpoints drain before SIGTERM
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
