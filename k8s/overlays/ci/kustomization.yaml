# Used by GitHub Actions on a kind cluster: slim image + mock model = fast e2e.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../dev
images:
  - {name: nlp-api, newName: nlp-api, newTag: ci}
configMapGenerator:
  - name: nlp-api-config
    behavior: merge
    literals: [MODEL_BACKEND=mock]
patches:
  - target: {kind: Deployment, name: nlp-api}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: 50m}
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 128Mi}
      - {op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 512Mi}
