apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - {name: nlp-api, newName: nlp-api, newTag: dev}
configMapGenerator:
  - name: nlp-api-config
    behavior: merge
    literals: [LOG_LEVEL=DEBUG]
patches:
  - target: {kind: HorizontalPodAutoscaler, name: nlp-api}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 1}
      - {op: replace, path: /spec/maxReplicas, value: 3}
  - target: {kind: Deployment, name: nlp-api}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: 250m}
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 768Mi}
